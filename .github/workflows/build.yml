name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Compile app and diagnostics
        shell: powershell
        run: ./build.ps1
      - name: Check protocol and colour conversion
        shell: powershell
        run: |
          & ./AmbientLite.Diagnostics.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Self-test failed' }
      - name: Check mode transitions and shutdown regressions
        shell: powershell
        run: ./tests/session.ps1
      - name: Check GPU downsampling and readback
        shell: powershell
        run: |
          & ./AmbientLite.Diagnostics.exe --capture-self-test
          if ($LASTEXITCODE -ne 0) { throw 'GPU capture test failed' }
      - name: Prepare installer compiler
        shell: powershell
        run: |
          $download = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe' -OutFile $download
          if ((Get-FileHash $download -Algorithm SHA256).Hash.ToLowerInvariant() -ne '0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f') { throw 'Compiler checksum mismatch' }
          $compiler = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          $process = Start-Process $download -ArgumentList @('/PORTABLE=1','/CURRENTUSER','/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/NOICONS',('/DIR="' + $compiler + '"')) -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw 'Compiler preparation failed' }
          "INNO_COMPILER=$compiler\ISCC.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build installer
        shell: powershell
        run: ./build-setup.ps1 -Compiler $env:INNO_COMPILER
      - name: Package downloads
        shell: powershell
        run: ./package.ps1
      - name: Check installation and startup lifecycle
        shell: powershell
        run: ./tests/installation.ps1
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: AmbientLite-windows-x64
          path: dist/*

      - name: Publish compatible tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $manifest = Get-Content dist/AmbientLite-companion-update.json -Raw | ConvertFrom-Json
          if ($env:GITHUB_REF_NAME -ne ('v'+$manifest.Version)) { throw 'Tag and package version differ' }
          gh release create $env:GITHUB_REF_NAME dist/AmbientLite-windows-x64.zip dist/AmbientLite.exe ('dist/'+$manifest.Archive) dist/AmbientLite-companion-update.json dist/SHA256SUMS.txt --verify-tag --title ('AmbientLite '+$manifest.Version) --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
